services:
    db:
        # Uncomment to expose the DB on the host. Use a free port, e.g.:
        # ports:
        #     - "${OMRS_DB_HOST_PORT:-3306}:3306"
        restart: "no"
        #volumes:
            # Comment out if DB should be created from scratch
            #- ./initial_test_db.sql:/docker-entrypoint-initdb.d/initial_test_db.sql

    api:
        image: openmrs/openmrs-core:${TAG:-dev}
        build:
            target: dev
            context: .    
            cache_from:
                -   openmrs/openmrs-core:${TAG:-dev}
        # El puerto 8080 (HTTP) ya NO se publica directamente al host: usar el overlay
        # docker-compose.proxy.yml, que expone 8080 (redirect a HTTPS) y 8443 (TLS) a traves
        # de nginx. Publicar 8080 aca de nuevo reabriria el bypass sin TLS/cookie-hardening
        # que ese proxy existe para cerrar - ver monitoring/proxy/default.conf.template.
        ports:
            - "${OMRS_DEBUG_HOST_PORT:-8000}:8000"
            - "${OMRS_SCHEDULER_HOST_PORT:-9000}:9000"
        environment:
            OMRS_DEV_DEBUG_PORT: ${OMRS_DEV_DEBUG_PORT:-8000}
            OMRS_CREATE_TABLES: ${OMRS_CREATE_TABLES:-true}
            
            OMRS_BUILD: ${OMRS_BUILD:-false}
            OMRS_BUILD_GOALS: ${OMRS_BUILD_GOALS:-}
            OMRS_BUILD_ARGS: ${OMRS_BUILD_ARGS:-}
            
            OMRS_EXTRA_JOBRUNR_DASHBOARD_ENABLED: ${OMRS_EXTRA_JOBRUNR_DASHBOARD_ENABLED:-true}
            OMRS_EXTRA_JOBRUNR_DASHBOARD_PASSWORD: ${OMRS_EXTRA_JOBRUNR_DASHBOARD_PASSWORD:-Admin123}
            OMRS_EXTRA_JOBRUNR_DASHBOARD_PORT: ${OMRS_EXTRA_JOBRUNR_DASHBOARD_PORT:-9000}
        volumes:
            - ./:/openmrs_core
            - ./target/data:/openmrs/data/
        restart: "no"
