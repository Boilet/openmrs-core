global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Docker host metrics
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Container metrics
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # MariaDB metrics
  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Loki internal metrics
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Alloy (log collection) internal metrics
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # OpenMRS HTTP health probe (checks /openmrs/health/alive)
  - job_name: openmrs-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8080/openmrs/health/alive
        labels:
          application: openmrs
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # OpenMRS TCP reachability probe (is Tomcat accepting connections?)
  - job_name: openmrs-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - api:8080
        labels:
          application: openmrs
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Control de seguridad: el puerto HTTP del proxy (8080) debe SIEMPRE redirigir a HTTPS, nunca
  # servir contenido en claro. Requiere docker-compose.proxy.yml en el mismo `docker compose up`.
  # Si probe_success cae a 0, ver la alerta InsecureHTTPExposureDetected en alerts.yml.
  - job_name: proxy-http-redirect-check
    metrics_path: /probe
    params:
      module: [http_redirect_to_https]
    static_configs:
      - targets:
          - http://proxy:8080/openmrs
        labels:
          application: openmrs-proxy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Control de seguridad: el Set-Cookie de sesion servido por HTTPS debe traer siempre
  # Secure + HttpOnly + SameSite (ver monitoring/proxy/default.conf.template). Si probe_success
  # cae a 0, ver la alerta SessionCookieMissingSecurityFlags en alerts.yml.
  - job_name: proxy-secure-cookie-check
    metrics_path: /probe
    params:
      module: [https_secure_cookie]
    static_configs:
      - targets:
          # index.htm (no autenticado) responde 200 y siempre trae Set-Cookie; el health-check
          # (/openmrs/health/alive) no sirve aca porque ese endpoint no abre sesion.
          - https://proxy:8443/openmrs/index.htm
        labels:
          application: openmrs-proxy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115